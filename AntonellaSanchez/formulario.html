<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
        <header class="contenedor">
    <h2>Formulario de Contacto</h2>

        <form>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" placeholder="Ingresa tu apellido" required>

        <label for="gmail">Gmail</label>
        <input type="email" id="gmail" placeholder="ejemplo@gmail.com" required>

        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" placeholder="Ingresa tu dirección">

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" placeholder="+56 9 1234 5678">

        <label for="comentario">Comentario</label>
        <textarea id="comentario" rows="5" placeholder="Escribe tu comentario..."></textarea>

        <button type="submit">Enviar</button>
        </form>
        </header>

</body>
</html>
