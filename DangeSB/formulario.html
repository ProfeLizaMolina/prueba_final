    <main>
        <section>
            <h2>Registro de Datos de Proxy</h2>
            <p>Utiliza este panel de simulación para registrar tus datos de la Inter-Red y planificar tus encargos en las Cavidades.</p>
            
            <form action="#" method="POST">
                <p>
                    <label for="usuario">Nombre de Usuario / Proxy:</label><br>
                    <input type="text" id="usuario" name="usuario" placeholder="Ej: Phaethon_User">
                </p>
                <p>
                    <label for="nivel">Nivel de Inter-Red (IK):</label><br>
                    <input type="text" id="nivel" name="nivel" placeholder="Ej: Nivel 50">
                </p>
                <p>
                    <label for="detalles">Notas del Encargo o Equipo:</label><br>
                    <textarea id="detalles" name="detalles" rows="4" placeholder="Describe la estrategia o agentes asignados..."></textarea>
                </p>
                <button type="submit">Guardar Registro</button>
            </form>
        </section>
    </main>

</body>
