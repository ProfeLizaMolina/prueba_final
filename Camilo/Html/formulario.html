<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <!-- Hoja de estilos vinculada al formulario -->
    <link rel="stylesheet" href="../Style/formulario.css">
</head>

<body>
    <!-- Encabezado general -->
    <header>
        <h1>Camilo Mori Vásquez</h1>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="quienesSomos.html">Quién Soy</a>
            <a href="historiaDeUsuario.html">Historia</a>
            <a href="formulario.html">Formulario</a>
            <a href="tabla.html">Presupuesto</a>
        </nav>
    </header>

    <main>
        <!-- Caja del formulario: agrupa todas las etiquetas -->
        <section class="caja">
            <h2>Formulario de Contacto</h2>
            <form>
                <!-- Campo para Nombre -->
                <label>Nombre</label>
                <input type="text" placeholder="Ingrese su nombre">

                <!-- Campo para Apellido -->
                <label>Apellido</label>
                <input type="text" placeholder="Ingrese su apellido">

                <!-- Campo para Correo -->
                <label>Correo Electrónico</label>
                <input type="email" placeholder="Ingrese su correo">

                <!-- Campo para Edad -->
                <label>Edad</label>
                <input type="number" placeholder="Ingrese su edad">

                <!-- Área de texto para mensajes largos -->
                <label>Mensaje</label>
                <textarea rows="6" placeholder="Escriba su mensaje"></textarea>

                <!-- Botón de envío de datos -->
                <input type="submit" value="Enviar">
            </form>
        </section>
    </main>

    <footer>
        &copy; 2026 Camilo Mori Vásquez
    </footer>

</body>

</html>
