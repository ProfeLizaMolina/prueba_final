<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Contacto</title>

<link rel="stylesheet" href="estilo.css">
</head>

<body>

<div class="formulario">

<h1>Formulario de Contacto</h1>
<p class="texto">Completa los siguientes datos</p>

<form id="formulario">

<div class="campo">
<label for="nombre">Nombre</label>
<input type="text" id="nombre" placeholder="Tu nombre" required>
</div>

<div class="campo">
<label for="apellido">Apellido</label>
<input type="text" id="apellido" placeholder="Tu apellido" required>
</div>

<div class="campo">
<label for="gmail">Gmail</label>
<input type="email" id="gmail" placeholder="Tu gmail" required>
</div>

<div class="campo">
<label for="direccion">Dirección</label>
<input type="text" id="direccion" placeholder="Tu dirección" required>
</div>

<div class="campo">
<label for="telefono">Teléfono</label>
<input type="tel" id="telefono" placeholder="Tu teléfono" required>
</div>

<div class="campo">
<label for="comentario">Comentario</label>
<textarea id="comentario" placeholder="comentario" required></textarea>
</div>

<button type="submit">Enviar</button>

<p id="mensaje"></p>

</form>

</div>
    <footer>
        <p>Creado por: Gianella Medina</p>
    </footer

</body>
</html>
